body{margin:0;font-family:var(--font-sans);color:var(--foreground)}figure{margin:0}figcaption{font-size:18px;font-weight:600;margin-bottom:6px}.unit{font-size:13px;opacity:.7;margin:0 0 20px}.chart{height:130px;display:flex;flex-direction:column;gap:20px;justify-content:center}.row{display:grid;grid-template-columns:60px minmax(0,1fr) 44px;align-items:center;gap:12px;font-size:14px}.track{height:28px;background:var(--secondary);border-radius:4px;overflow:hidden}.fill{height:100%;border-radius:4px;background:var(--chart-1)}.before{background:var(--chart-3)}.value{font-variant-numeric:tabular-nums;text-align:right}.note{font-size:12px;line-height:1.5;opacity:.7;margin:12px 0 0}
